<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>肉いざり</title>
         <link rel="stylesheet" href="css/style.css">
        </head>
    <body>

        <header>

    <span class="header-corner corner-tl">✦</span>
    <span class="header-corner corner-tr">✦</span>
    <span class="header-corner corner-bl">✦</span>
    <span class="header-corner corner-br">✦</span>

            <div class="header-decoration">
    <img src="images/星.png" alt="">
    <h1>にしこの脳内</h1>
    <img src="images/クローバー.png" alt="">
</div>
            <p>恋は下心、愛は真心</p>
            </header>

            <main>
                <h2>裏話</h2>

                <div id="urabanashi-posts"></div>

                 <nav>
                <a href="index.html">😼ホーム😼</a>
                <a href="about.html">🙀ABOUT🙀</a>
                <a href="gallery.html">😽作品たち😽</a>
                <a href="urabanashi.html">😾裏話😾</a>
                <a href="diary.html">😻日記😻</a>
                <a href="characters.html">😸キャラ😸</a>
                </nav>

            </main>

            <script>
fetch("data/urabanashi.json")
    .then(response => response.json())
    .then(data => {

        const container = document.getElementById("urabanashi-posts");

        const posts = [...data.posts].reverse();

        posts.forEach(post => {

            const article = document.createElement("article");

            const date = document.createElement("h4");
            date.textContent = post.date;

            const title = document.createElement("h4");
            title.textContent = post.title;

            article.appendChild(date);
            article.appendChild(title);


            post.blocks.forEach(block => {

                /* 📝 文章 */

                if (block.type === "text") {

                    const text = document.createElement("p");

                    text.innerHTML =
                        block.text.replace(/\n/g, "<br>");

                    article.appendChild(text);

                }


                /* 🖼 画像 */

                if (block.type === "image") {

                    const image = document.createElement("img");

                    image.src = block.image;
                    image.className = "diary-image";

                    article.appendChild(image);

                }


                /* 🖼📝 画像左＋文章右 */

                if (block.type === "image_left") {

                    const row = document.createElement("div");

                    row.className = "diary-row";

                    const image = document.createElement("img");

                    image.src = block.image;

                    const text = document.createElement("p");

                    text.innerHTML =
                        block.text.replace(/\n/g, "<br>");

                    row.appendChild(image);

                    row.appendChild(text);

                    article.appendChild(row);

                }


                /* 📝🖼 文章左＋画像右 */

                if (block.type === "image_right") {

                    const row = document.createElement("div");

                    row.className = "diary-row";

                    const text = document.createElement("p");

                    text.innerHTML =
                        block.text.replace(/\n/g, "<br>");

                    const image = document.createElement("img");

                    image.src = block.image;

                    row.appendChild(text);

                    row.appendChild(image);

                    article.appendChild(row);

                }


                /* 🖼🖼 画像2枚横並び */

                if (block.type === "two_images") {

                    const row = document.createElement("div");

                    row.className = "diary-two-images";

                    const image1 = document.createElement("img");

                    image1.src = block.image1;

                    const image2 = document.createElement("img");

                    image2.src = block.image2;

                    row.appendChild(image1);

                    row.appendChild(image2);

                    article.appendChild(row);

                }

            });


            container.appendChild(article);

        });

    })
    .catch(error => {

        console.error(
            "裏話の読み込みに失敗しました:",
            error
        );

    });
</script>


            </body>
</html>
