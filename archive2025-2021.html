                `

        ];


        /* =========================
           ギャラリーを作る
        ========================= */

        const gallery =
            document.getElementById("archive-gallery");


        archivePosts.forEach((post, index) => {

            const item =
                document.createElement("button");


            item.className =
                "archive-item";


            item.innerHTML = `
                <img
                    src="${post.image}"
                    alt="${post.date}"
                >

                <p>${post.date}</p>
            `;


            item.addEventListener(
                "click",
                () => {

                    openArchive(index);

                }
            );


            gallery.appendChild(item);

        });


        /* =========================
           ポップアップを開く
        ========================= */

        function openArchive(index) {

            const post =
                archivePosts[index];


            document
                .getElementById("modal-image")
                .src = post.image;


            document
                .getElementById("modal-image")
                .alt = post.date;


            document
                .getElementById("modal-date")
                .textContent = post.date;


            document
                .getElementById("modal-text")
                .innerHTML = post.text;


            document
                .getElementById("archive-modal")
                .classList.add("active");

        }


        /* =========================
           ポップアップを閉じる
        ========================= */

        function closeArchive() {

            document
                .getElementById("archive-modal")
                .classList.remove("active");

        }


        /* 背景を押しても閉じられるようにする */

        document
            .getElementById("archive-modal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeArchive();

                    }

                }
            );
