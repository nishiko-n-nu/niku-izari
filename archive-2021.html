</div>

    <main>

        <p class="archive-intro">

        <!-- ここにJavaScriptで画像一覧が自動表示されます -->

        <!-- ナビ -->
        <nav>
        <a href="index.html">😼ホーム😼</a>
        <a href="about.html">🙀ABOUT of にしこ🙀</a>
        <a href="gallery.html">😽作品たち😽</a>

    <!-- ポップアップ -->
    <div id="archive-modal" class="archive-modal">

        <div class="archive-modal-content">

            <button
                class="archive-close"
                onclick="closeArchive()"
                aria-label="閉じる"
            >
                ×
            </button>


            <img id="modal-image" src="" alt="">


            <h2 id="modal-date"></h2>


            <!-- 自語りがここに表示されます -->
            <div id="modal-text"></div>

        </div>

    </div>


    <script>

        /* =========================
           アーカイブのデータ
        ========================= */

        const archivePosts = [

            {
                image: "images/archive-2025-1.png",

                date: "2025年1月ごろ",

                text: `
                    <p>
                        ここに当時の自語りを書くにょ。
                    </p>

                    <p>
                        昔の自分はこんな絵を描いていました。
                    </p>
                `
            },


            {
                image: "images/archive-2025-2.png",

                date: "2025年6月ごろ",

                text: `
                    <p>
                        2枚目の画像についての自語りにょ。
                    </p>

                    <p>
                        この頃はこういうことを考えていました。
                    </p>
                `
            },


            {
                image: "images/archive-2025-3.png",

                date: "2025年10月ごろ",

                text: `
                    <p>
                        3枚目の自語りにょ。
                    </p>
                `
            }

        ];


        /* =========================
           ギャラリーを作る
        ========================= */

        const gallery =
            document.getElementById("archive-gallery");


        archivePosts.forEach((post, index) => {

            const item =
                document.createElement("button");


            item.className =
                "archive-item";


            item.innerHTML = `
                <img
                    src="${post.image}"
                    alt="${post.date}"
                >

                <p>${post.date}</p>
            `;


            item.addEventListener(
                "click",
                () => {

                    openArchive(index);

                }
            );


            gallery.appendChild(item);

        });


        /* =========================
           ポップアップを開く
        ========================= */

        function openArchive(index) {

            const post =
                archivePosts[index];


            document
                .getElementById("archive-modal-image")
                .src = post.image;


            document
                .getElementById("archive-modal-image")
                .alt = post.date;


            document
                .getElementById("archive-modal-date")
                .textContent = post.date;


            document
                .getElementById("archive-modal-text")
                .innerHTML = post.text;


            document
                .getElementById("archive-modal")
                .classList.add("active");

        }


        /* =========================
           ポップアップを閉じる
        ========================= */

        function closeArchive() {

            document
                .getElementById("archive-modal")
                .classList.remove("active");

        }


        /* 背景を押しても閉じられるようにする */

        document
            .getElementById("archive-modal")
            .addEventListener(
                "click",
                function(event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closeArchive();

                    }

                }
            );

    </script>

</body>
