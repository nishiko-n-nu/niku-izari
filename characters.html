<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>肉いざり</title>
         <link rel="stylesheet" href="css/style.css">
        </head>
    <body>
        <header>

    <span class="header-corner corner-tl">✦</span>
    <span class="header-corner corner-tr">✦</span>
    <span class="header-corner corner-bl">✦</span>
    <span class="header-corner corner-br">✦</span>

            <div class="header-decoration">
    <img src="images/星.png" alt="">
    <h1>にしこの脳内</h1>
    <img src="images/クローバー.png" alt="">
</div>
            <p>恋は下心、愛は真心</p>
            </header>
    
    <main>

    <h2>キャラクター紹介</h2>

    <h3 class="work-title">黒歴史二毛作シェアハウス</h3>

    <div class="character-list">

        <button class="character-item"
            data-name="寝待ルナ"
            data-popup-image="images/character/全体ルナ.png"
            data-created="2018年"
            data-age="16歳"
            data-description="元気いっぱいな女の子！複雑な家庭事情に負けない笑顔と明るさでみんなを振り回している。年の近い明と夕、カインと特に仲が良く、許可をもらっては4人で外出をしている。アウトドア派。肉じゃがが大好物で、いつか母親が作った肉じゃがを食べてみたいと思っている。">

            <img src="images/character/ルナ.png" alt="ルナ">
            <p>ルナ</p>

        </button>

        <button class="character-item"
            data-name="犬道カイン"
            data-popup-image="images/character/全体カイン.png"
            data-created="2020年"
            data-age="17歳"
            data-description="いつでもクール、でも心はロックなゲイ。基本的にルナに振り回されている。狼と人間のハーフであり、人間の遺伝子のほうが強い。満月になるとしっぽがちらつく程度だが、それでも本人は抜け毛などに困っている。音楽、特にロックが好きでギターの練習中だそう。バンドを組んだらギターヴォーカルがやりたいんだとか。">

            <img src="images/character/カイン.png" alt="カイン">
            <p>カイン</p>

        </button>

        <button class="character-item"
            data-name="黒羽ツバサ"
            data-popup-image="images/character/全体ツバサ.png"
            data-created="2020年"
            data-age="20歳"
            data-description="しっかりサバサバした性格のお姉さん。みんなからは「ツバサ姉さん」と呼ばれて親しまれている。カラスと意思疎通できるらしいが、意味不明だし不潔なのでやめてほしいところ。財閥令嬢とも言っているが、じゃあなんでこんなシェアハウスに住んでいるのだろうか。">

            <img src="images/character/ツバサ.png" alt="ツバサ">
            <p>ツバサ</p>

        </button>

        <button class="character-item"
            data-name="メアリー・ル・ローフォード"
            data-popup-image="images/character/全体メアリー.png"
            data-created="2020年ごろ"
            data-age="15歳"
            data-description="ニョメニョメ王国から派遣された妖精によって魔法少女になった。だが、魔法を使っているところは誰も見たことがない。怪人を倒すときは手持ちのステッキでぶん殴っている。彼女を怒らせるともれなくステッキでぶん殴られるので注意してください。">

            <img src="images/character/メアリー.png" alt="メアリー">
            <p>メアリー</p>

        </button>

        <button class="character-item"
            data-name="夕(ゆう)"
            data-popup-image="images/character/全体夕.png"
            data-created="2021年"
            data-age="16歳"
            data-description="明の双子の姉。見た目からして根暗そうだが以外とノリがよくネットミームに詳しい。最近は冷笑が癖になっていて、明やカインからやめてほしいと注意されている。それからは熱血に舵を切ろうと、ニコニコ動画で松○修造の音MADを見ることを日課にしだした。">

            <img src="images/character/夕.png" alt="夕">
            <p>夕</p>

        </button>

        <button class="character-item"
            data-name="明(めい)"
            data-popup-image="images/character/全体明.png"
            data-created="2019年～2021年"
            data-age="16歳"
            data-description="夕の双子の弟。誰にでも人当たりが良いが、何を考えているかわからない怖さもある。ルナと夕とでカインにいたずらを仕掛けては怒られるというのを毎日繰り返している。夕の冷笑癖を辞めさせるべく松岡○造の音MADを夕におすすめした。">

            <img src="images/character/明.png" alt="明">
            <p>明</p>

        </button>

        <button class="character-item"
            data-name="佐々木こんた"
            data-popup-image="images/character/全体こんた.png"
            data-created="2022年ごろ"
            data-age="？歳"
            data-description="人に化けた狐。ちゃらくて女好きで、女性陣からはドン引かれている。化け狐の師匠から「人間を見習え！！」と怒られてこのシェアハウスに入れられてしまった。しっぽが九本のモテモテイケイケ狐になることを夢見て、今日も煩悩にまみれている。早くマトモに働くべきだよ。">

            <img src="images/character/こんた.png" alt="こんた">
            <p>こんた</p>

        </button>

        <button class="character-item"
            data-name="猫又かじき"
            data-popup-image="images/character/全体かじき.png"
            data-created="2022年ごろ"
            data-age="24歳"
            data-description="人を化かすべく怪しい壺などをマルチに売る猫の妖怪。シェアハウスのみんなからはマルチンとかマルカスとか波動お兄さんとか呼ばれている。挨拶は、「毒電波にお困りではありませんか？」。ゲイで、カインとお付き合いしているらしいがリビングでいちゃつくのは気まずいからやめてほしい。">

            <img src="images/character/かじき.png" alt="かじき">
            <p>かじき</p>

        </button>

        <button class="character-item"
            data-name="天音"
            data-popup-image="images/character/全体天音.png"
            data-created="2021年"
            data-age="？歳"
            data-description="生意気な天使。人を見下している。実はこのシェアハウスは精神病棟で、彼女はそこの職員である。だがこの羽は偽物だろうか？顔がかわいくてあっちこっち行ってるのが天使に見えるだけだろうが、本当に羽が生えているみたいだ。">

            <img src="images/character/天音.png" alt="あまね">
            <p>天音</p>

        </button>


        
    </div>

</main>

<div class="character-modal" id="character-modal">

    <div class="character-modal-content">

        <button class="modal-close" id="modal-close">
            ×
        </button>

        <h2 id="modal-name"></h2>

        <img
            id="modal-image"
            src=""
            alt=""
        >

        <div class="character-info">

            <h3>いつ生まれたか</h3>
            <p id="modal-created"></p>

            <h3>年齢</h3>
            <p id="modal-age"></p>

            <h3>キャラクター説明</h3>
            <p id="modal-description"></p>

        </div>

    </div>

</div>

                <nav>
                <a href="index.html">😼ホーム😼</a>
                <a href="about.html">🙀ABOUT of にしこ🙀</a>
                <a href="gallery.html">😽作品たち😽</a>
                <a href="urabanashi.html">😾裏話😾</a>
                <a href="diary.html">😻日記😻</a>
                <a href="characters.html">😸キャラ一覧😸</a>
                </nav>

<script>

const characterItems =
    document.querySelectorAll(".character-item");

const modal =
    document.getElementById("character-modal");

const closeButton =
    document.getElementById("modal-close");


characterItems.forEach(item => {

    item.addEventListener("click", () => {

        document.getElementById("modal-name").textContent =
            item.dataset.name;

        document.getElementById("modal-image").src =
            item.dataset.popupImage;

        document.getElementById("modal-image").alt =
            item.dataset.name;

        document.getElementById("modal-created").textContent =
            item.dataset.created;

        document.getElementById("modal-age").textContent =
            item.dataset.age;

        document.getElementById("modal-description").textContent =
            item.dataset.description;

        modal.classList.add("show");

    });

});


closeButton.addEventListener("click", () => {

    modal.classList.remove("show");

});


modal.addEventListener("click", event => {

    if (event.target === modal) {

        modal.classList.remove("show");

    }

});

</script>

    </body>
</html>
